{% extends "layout.html" %}

{% block title %}
    Parties
{% endblock %}

{% block main %}
    <h2>Parties</h2>

    <table>

        <thead>
            <tr>
                <th>DM</th>
                <th>Id</th>
                <th>Name</th>
            </tr>
        </thead>

        <tbody>
            {% for party in parties %}
                <tr>
                    <td>{{ party.dm_id }}</td>
                    <td>{{ party.id }}</td>
                    <td>{{ party.name }}</td>
                    <td>
                        <form action="/party/{{ party.id }}" method="get">
                            <button class="btn btn-primary" type="submit">View</button>
                        </form>
                    </td>
                </tr>
            {% endfor %}
        </tbody>

    </table>
{% endblock %}
