{% extends "layout.html" %}

{% block title %}
    {{ character.name }}
{% endblock %}

{% block main %}
    <form action="/character/{{ character.id }}/edit" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="name" value="{{ character.name }}" type="text">
            <input autocomplete="off" class="form-control mx-auto w-auto" name="prof_bonus" value="{{ character.prof_bonus }}" type="number">
            <input autocomplete="off" class="form-control mx-auto w-auto" name="max_hitpoints" value="{{ character.max_hitpoints }}" type="number">
        </div>
        <button class="btn btn-primary" type="submit">Confirm</button>
    </form>
{% endblock %}
