{% extends "layout.html" %}

{% block title %}
    {{ character.name }}
{% endblock %}

{% block main %}
    <table>

        <thead>
            <tr>
                <th>Name</th>
                <th>Prof. Bonus</th>
                <th>Max HP</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>{{ character.name }}</td>
                <td>{{ character.prof_bonus }}</td>
                <td>{{ character.max_hitpoints }}</td>
                {% if character.user_id == user %}
                <td>
                    <form action="/character/{{ character.id }}/edit" method="get">
                        <button class="btn btn-primary" type="submit">Edit</button>
                    </form>
                </td>
                {% endif %}
            </tr>
        </tbody>

    </table>
{% endblock %}
