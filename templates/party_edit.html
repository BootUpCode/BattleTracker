{% extends "layout.html" %}

{% block title %}
    {{ party.name }}
{% endblock %}

{% block main %}
    <form action="/party/{{ party.id }}/edit" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="name" value="{{ party.name }}" type="text">
        </div>
        <button class="btn btn-primary" type="submit">Confirm</button>
    </form>
{% endblock %}
